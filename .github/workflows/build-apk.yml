{
"name": "Build APK",
"on": {"push": {"branches": ["main"]}, "workflow_dispatch": {}},
"jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [
{"uses": "actions/checkout@v4"},
{"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}},
{"name": "Download OCR language data", "run": "mkdir -p app/src/main/assets/tessdata && curl -sSfL -o app/src/main/assets/tessdata/eng.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata && curl -sSfL -o app/src/main/assets/tessdata/urd.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/urd.traineddata"},
{"name": "Accept Android SDK licenses", "run": "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true"},
{"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.7"}},
{"name": "Build debug APK", "run": "gradle assembleDebug --no-daemon --stacktrace"},
{"uses": "actions/upload-artifact@v4", "with": {"name": "ScreenOCR-apk", "path": "app/build/outputs/apk/debug/app-debug.apk"}}
]}}
}
